# Declared so that `pip install ".[test]"` is the one install step the README gives for the
# tests. With no backend named, pip falls back to an implicit setuptools it fetches unasked.
[build-system]
# 77 is the first setuptools to accept the SPDX `license` string in [project] (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "os-schedule-gen"
version = "0.2.0"
description = "A multi-OS scheduler file generator: write a schedule once and run it on Windows, Linux and macOS."
readme = "README.md"
license = "AGPL-3.0-or-later"
# The oldest interpreter the suites are run on and the code is type-checked for. The ruff
# and mypy targets below follow it: a newer target would pass syntax and standard-library
# names that are an error here.
requires-python = ">=3.12"
# Deliberately empty: the library, its command line and both vendored libraries use the
# standard library alone.
dependencies = []

[project.optional-dependencies]
# The property tests in stdio_utf8/tests/. Tests only: nothing at runtime imports it.
test = ["hypothesis==6.165.10"]

[tool.setuptools]
# Deliberately empty. The tool is run directly and puts src/ and its two library folders on
# sys.path itself, so nothing here is imported from an installed location: installing this
# distribution installs its metadata and test dependencies, never code. Left to
# auto-discovery, setuptools refuses this flat layout of sibling folders outright.
packages = []

[tool.ruff]
target-version = "py312"

[tool.ruff.format]
# The Python blocks inside the Markdown docs are laid out by hand, and ruff's formatter
# would reflow them; every .py file is still held to the formatter.
exclude = ["*.md"]

[tool.ruff.lint]
# E4/E7/E9/F are ruff's classic default set, written out so the enabled rules are a
# function of this file rather than of whichever ruff release is installed. PGH003 and
# PGH004 flag a bare `# type: ignore` or `# noqa`, one that names no rule code. D adds the
# docstring rules (pep257), minus D401's imperative-mood opinion, which flags valid
# noun-phrase summaries.
select = ["E4", "E7", "E9", "F", "PGH003", "PGH004", "D"]
ignore = ["D401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Test method names say what each test does; a docstring per test would be noise.
"**/test_*.py" = ["D"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
# The tool, its src/ modules and its tests reach each other and the two library folders
# through sys.path inserts at run time; mypy cannot see a runtime insert, so these entries
# are what make those imports resolve.
mypy_path = [
  "$MYPY_CONFIG_FILE_DIR",
  "$MYPY_CONFIG_FILE_DIR/src",
  "$MYPY_CONFIG_FILE_DIR/tests",
  "$MYPY_CONFIG_FILE_DIR/stdio_utf8",
  "$MYPY_CONFIG_FILE_DIR/help_formatter",
]

[tool.coverage.run]
# Branch coverage, not line coverage: a line can run while one side of its condition
# never does.
branch = true

[tool.coverage.report]
# `# pragma: only-on posix` marks a line only a POSIX host runs, and
# `# pragma: only-on win32` one only Windows runs. Each is excluded on the other kind of
# host alone, so both stay measured where they run. coverage.py's configuration can read
# environment variables but not the platform, so it keys on OS: Windows sets it to
# Windows_NT in every process and POSIX systems leave it unset. exclude_also adds to
# coverage.py's default patterns, so `# pragma: no cover` keeps working.
exclude_also = [
  'pragma:\s*only-on\s+posix\b(?!${OS-})',
  'pragma:\s*only-on\s+win32\b${OS-}',
]
